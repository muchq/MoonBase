services:
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: always
    ports:
      # Loopback only: reach it with `ssh -L 9090:127.0.0.1:9090`. Public, the
      # lifecycle API below would let anyone stop it.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./o11y/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=5GB'
      - '--web.enable-lifecycle'
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    restart: always
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./o11y/otel-collector.yml:/etc/otel-collector-config.yml
      # What the hostmetrics receiver reads through `root_path: /hostfs`.
      # Read-only, and the reason the Host page can report the machine rather
      # than this container — cadvisor below has had the equivalent all along.
      - /:/hostfs:ro
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    privileged: true
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # Host /proc/vmstat only: otel hostmetrics has no oom_kill, and cAdvisor's
  # container_oom_events_total misses global OOM kills of children inside a
  # container still under its cgroup limit (Stockfish on chess_engine).
  # disable-defaults keeps this from becoming a second full host agent.
  node_exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: always
    command:
      - '--path.procfs=/host/proc'
      - '--collector.disable-defaults'
      - '--collector.vmstat'
    volumes:
      - /proc:/host/proc:ro
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

volumes:
  prometheus_data:
  grafana_data:

networks:
  app_network:
    external: true
    name: muchq_network
