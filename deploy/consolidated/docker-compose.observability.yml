services:
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./o11y/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=5GB'
      - '--web.enable-lifecycle'
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.160.0
    restart: always
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./o11y/otel-collector.yml:/etc/otel-collector-config.yml
      # What the hostmetrics receiver reads through `root_path: /hostfs`.
      # Read-only, and the reason the Host page can report the machine rather
      # than this container — cadvisor below has had the equivalent all along.
      - /:/hostfs:ro
    ports:
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics endpoint
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    privileged: true
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # Host /proc/vmstat only: otel hostmetrics has no oom_kill, and cAdvisor's
  # container_oom_events_total misses global OOM kills of children inside a
  # container still under its cgroup limit (Stockfish on chess_engine).
  # disable-defaults keeps this from becoming a second full host agent.
  node_exporter:
    image: prom/node-exporter:v1.12.1
    restart: always
    command:
      - '--path.procfs=/host/proc'
      - '--collector.disable-defaults'
      - '--collector.vmstat'
    volumes:
      - /proc:/host/proc:ro
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

volumes:
  prometheus_data:
  grafana_data:

networks:
  app_network:
    external: true
    name: muchq_network
