# One cap for every container's stdout: the json-file driver keeps
# everything by default and nothing rotates it, so an unbounded logger is a
# disk-fill on this single host (#1456). Merged per service rather than set
# host-wide so the file is the whole truth of the deployment.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /var/log/caddy:/var/log/caddy
    depends_on:
      - games_hub
      - microgpt-serve
      - mithril
      - one_d4
      - one_d4_v2
      - portrait
      - prom_proxy
      - iili
      - mcpserver
    networks:
      # Static address so services can name Caddy — and only Caddy — as
      # their x-forwarded-for trust boundary (smithy-cpp ADR-0012). The
      # anchor is the single source; consumers alias it as *caddy_ip.
      app_network:
        ipv4_address: &caddy_ip 172.28.0.2
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # The smithy event-stream games hub (/games/v2/*): the lobby (#1490),
  # golf and castle (#77) on one play stream.
  games_hub:
    image: ghcr.io/muchq/games_hub:${GAMES_HUB_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Games hub on smithy event streams (/games/v2/*)"
    restart: always
    logging: *default-logging
    ports:
      - "8089:8089"
    environment:
      PORT: "8089"
      # CSWSH defense: the play socket admits only the deployed UI's
      # origins.
      ALLOWED_ORIGINS: https://muchq.com,https://www.muchq.com
      TRUSTED_PROXY_CIDRS: *caddy_ip
      # Credentials live in the hub's own database on the shared postgres
      # instance (MoonBase#1194 step 1): tickets and resume tokens survive
      # deploys. games_hub_db_init provisions the role + database.
      GAMES_HUB_DB_URL: postgresql://games_hub:${GAMES_HUB_DB_PASSWORD:?unset}@shared_postgres:5432/games_hub
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      OTEL_SERVICE_NAME: games_hub
      OTEL_RESOURCE_ATTRIBUTES: service.name=games_hub,service.version=${GAMES_HUB_SHA:-${DEPLOY_SHA:-latest}}
    networks:
      - app_network
    depends_on:
      games_hub_db_init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # Steady /health probe (#1307): verifies the container serves, and keeps
      # the http_server_* series alive from boot, so dashboards don't go blind
      # after a deploy until the first real request. prom_proxy subtracts
      # route="/health" from every Serving number and charts it on the Probes
      # tile instead (#1303). Talks HTTP over bash's /dev/tcp because the
      # ubuntu base image ships no curl and no wget — see one_d4's probe for
      # the longer story, including why `timeout` bounds the probe itself.
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8089 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  portrait:
    image: ghcr.io/muchq/portrait:${PORTRAIT_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Ray-traced scene renderer"
    restart: always
    logging: *default-logging
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      # x-forwarded-for counts only from Caddy's pinned address; requests
      # reaching portrait any other way key as their TCP peer.
      TRUSTED_PROXY_CIDRS: *caddy_ip
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      OTEL_SERVICE_NAME: portrait
      OTEL_RESOURCE_ATTRIBUTES: service.name=portrait,service.version=${PORTRAIT_SHA:-${DEPLOY_SHA:-latest}}
    volumes:
      - /etc/portrait:/etc/portrait
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # Steady /health probe (#1307); see games_hub's for the full rationale.
      # Deliberately the dedicated health endpoint and never the trace route:
      # a 503 for a render too large to allocate must stay a per-request
      # error, not evidence the container is sick — unhealthy status is what
      # health-conditioned tooling acts on, and under an orchestrator it
      # means restart. The deploy config test pins this.
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8081 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  prom_proxy:
    image: ghcr.io/muchq/prom_proxy:${PROM_PROXY_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Metrics API behind the dashboard"
    restart: always
    logging: *default-logging
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - PROMETHEUS_URL=http://prometheus:9090
    volumes:
      - /etc/prom_proxy:/etc/prom_proxy
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  mithril:
    image: ghcr.io/muchq/mithril:${MITHRIL_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Word-ladder solver (wordchains)"
    restart: always
    logging: *default-logging
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4318
      - OTEL_SERVICE_NAME=mithril
      - OTEL_RESOURCE_ATTRIBUTES=service.name=mithril,service.version=${MITHRIL_SHA:-${DEPLOY_SHA:-latest}}
    volumes:
      - /etc/mithril:/etc/mithril
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # Steady /health probe (#1307); see games_hub's for the full rationale.
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8083 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  posterize:
    image: ghcr.io/muchq/posterize:${POSTERIZE_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Image blur and edge detection"
    restart: always
    logging: *default-logging
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4318
      - OTEL_SERVICE_NAME=posterize
      - OTEL_RESOURCE_ATTRIBUTES=service.name=posterize,service.version=${POSTERIZE_SHA:-${DEPLOY_SHA:-latest}}
    volumes:
      - /etc/posterize:/etc/posterize
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # Steady /health probe (#1307); see games_hub's for the full rationale.
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8084 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  one_d4_v2:
    image: ghcr.io/muchq/one_d4_v2:${ONE_D4_V2_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "one_d4 v2 API: /v2/analyze on the C++ detectors (#1389 phase 6)"
    restart: always
    logging: *default-logging
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      TRUSTED_PROXY_CIDRS: *caddy_ip
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      OTEL_SERVICE_NAME: one_d4_v2
      OTEL_RESOURCE_ATTRIBUTES: service.name=one_d4_v2,service.version=${ONE_D4_V2_SHA:-${DEPLOY_SHA:-latest}}
    networks:
      # one-d4-v2 for Java callers: java.net.URI gives a hostname containing
      # an underscore a null host. Caddy keeps using the service key.
      app_network:
        aliases:
          - one-d4-v2
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      # Steady /health probe; never the analyze route — a 400 for a bad PGN
      # must stay a per-request error, not evidence the container is sick.
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8090 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  iili:
    image: ghcr.io/muchq/iili:${IILI_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "URL shortener v2 API (C++)"
    restart: always
    logging: *default-logging
    ports:
      - "8091:8091"
    environment:
      PORT: "8091"
      IILI_DB_URL: postgresql://r3dr_v2:${R3DR_V2_DB_PASSWORD:?unset}@shared_postgres:5432/r3dr_v2
      TRUSTED_PROXY_CIDRS: *caddy_ip
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      OTEL_SERVICE_NAME: iili
      OTEL_RESOURCE_ATTRIBUTES: service.name=iili,service.version=${IILI_SHA:-${DEPLOY_SHA:-latest}}
    networks:
      - app_network
    depends_on:
      iili_db_init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8091 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcpserver:
    image: ghcr.io/muchq/mcpserver:${MCPSERVER_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Model Context Protocol server"
    restart: always
    logging: *default-logging
    ports:
      - "8086:8080"
    environment:
      - PORT=8080
      - APP_NAME=mcpserver
      - ONE_D4_BASE_URL=http://one-d4:8080
      - ONE_D4_V2_BASE_URL=http://one-d4-v2:8090
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4318
      - OTEL_SERVICE_NAME=mcpserver
      - OTEL_RESOURCE_ATTRIBUTES=service.name=mcpserver,service.version=${MCPSERVER_SHA:-${DEPLOY_SHA:-latest}}
    volumes:
      - /etc/mcpserver:/etc/mcpserver
    depends_on:
      one_d4:
        condition: service_healthy
      one_d4_v2:
        condition: service_healthy
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # Steady /health probe (#1307); see games_hub's for the full rationale.
      # Served by mcpserver's HealthController — static liveness, no database
      # check, on the azul base whose bash/head/grep this command relies on
      # (same base as one_d4).
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The one Postgres instance on this host; one_d4 and games_hub each keep a
  # database on it.
  #
  # The bootstrap database, role and pg_isready user are one_d4 because initdb
  # wrote them on first boot. POSTGRES_* is ignored on an initialized cluster,
  # so changing them here does nothing — that needs a migration.
  shared_postgres:
    image: postgres:18
    labels:
      com.muchq.description: "Shared PostgreSQL for MoonBase services"
    restart: always
    logging: *default-logging
    environment:
      - POSTGRES_DB=one_d4
      - POSTGRES_USER=one_d4
      - POSTGRES_PASSWORD=${ONE_D4_DB_PASSWORD}
    volumes:
      - shared_pgdata:/var/lib/postgresql
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U one_d4"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Idempotent one-shot provisioning of games_hub's own database and role on
  # the shared postgres instance (MoonBase#1194). Idempotent — safe on every
  # deploy. Runs as the instance's bootstrap superuser. The docker-entrypoint
  # initdb.d hook can't do this: it only fires on a fresh data volume.
  games_hub_db_init:
    image: postgres:18
    restart: "no"
    logging: *default-logging
    environment:
      PGHOST: shared_postgres
      PGUSER: one_d4
      PGDATABASE: one_d4
      PGPASSWORD: ${ONE_D4_DB_PASSWORD}
      GAMES_HUB_DB_PASSWORD: ${GAMES_HUB_DB_PASSWORD:?unset}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'games_hub'" | grep -q 1 \
          || psql -v ON_ERROR_STOP=1 -c "CREATE ROLE games_hub LOGIN"
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE games_hub WITH LOGIN PASSWORD '$${GAMES_HUB_DB_PASSWORD}'"
        psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname = 'games_hub'" | grep -q 1 \
          || psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE games_hub OWNER games_hub"
    networks:
      - app_network
    depends_on:
      shared_postgres:
        condition: service_healthy

  # The role, database and password keep the r3dr_v2 names the live rows were
  # provisioned under: renaming those is a live-database operation, not a
  # rename of this file.
  iili_db_init:
    image: postgres:18
    restart: "no"
    logging: *default-logging
    environment:
      PGHOST: shared_postgres
      PGUSER: one_d4
      PGDATABASE: one_d4
      PGPASSWORD: ${ONE_D4_DB_PASSWORD}
      R3DR_V2_DB_PASSWORD: ${R3DR_V2_DB_PASSWORD:?unset}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'r3dr_v2'" | grep -q 1 \
          || psql -v ON_ERROR_STOP=1 -c "CREATE ROLE r3dr_v2 LOGIN"
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE r3dr_v2 WITH LOGIN PASSWORD '$${R3DR_V2_DB_PASSWORD}'"
        psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname = 'r3dr_v2'" | grep -q 1 \
          || psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE r3dr_v2 OWNER r3dr_v2"
    networks:
      - app_network
    depends_on:
      shared_postgres:
        condition: service_healthy

  # The schema step (#1419): applies one_d4's migrations/ .sql files and
  # exits, before anything that needs the tables. Idempotent — safe on every
  # deploy, like games_hub_db_init above. The only writer of that schema:
  # one_d4 checks its work at boot rather than repeating it (#1426), and
  # one_d4_worker creates nothing, so it starts without waiting for the Java
  # service (#1418 measured that coupling as an error-loop until one_d4
  # came up).
  one_d4_migrate:
    image: ghcr.io/muchq/one_d4_migrate:${ONE_D4_MIGRATE_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "one_d4 schema migrations (one-shot)"
    restart: "no"
    logging: *default-logging
    environment:
      # socketTimeout: DataSourceFactory's 150s default was sized for the
      # retention sweep, but this step is the one that builds indexes — a
      # CREATE INDEX on a populated game_features sends nothing until it
      # finishes, and severing it here gates the worker off until the next
      # deploy. 30 minutes clears any plausible build while still ending a
      # true TCP black hole.
      - INDEXER_DB_URL=jdbc:postgresql://shared_postgres:5432/one_d4?socketTimeout=1800
      - INDEXER_DB_USERNAME=one_d4
      - INDEXER_DB_PASSWORD=${ONE_D4_DB_PASSWORD}
    networks:
      - app_network
    depends_on:
      shared_postgres:
        condition: service_healthy

  one_d4:
    image: ghcr.io/muchq/one_d4:${ONE_D4_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Chess corpus API: index submits, ChessQL queries (indexing runs in one_d4_worker)"
    restart: always
    logging: *default-logging
    ports:
      - "8088:8080"
    environment:
      - APP_NAME=one_d4
      - PORT=8080
      - INDEXER_DB_URL=jdbc:postgresql://shared_postgres:5432/one_d4
      - INDEXER_DB_USERNAME=one_d4
      - INDEXER_DB_PASSWORD=${ONE_D4_DB_PASSWORD}
      - SENTRY_DSN=${ONE_D4_SENTRY_DSN}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4318
      - OTEL_SERVICE_NAME=one_d4
      - OTEL_RESOURCE_ATTRIBUTES=service.name=one_d4,service.version=${ONE_D4_SHA:-${DEPLOY_SHA:-latest}}
      # Query events (#1465) roll into this directory; log_shipper ships them.
      - QUERY_EVENT_LOG_DIR=/var/log/one_d4
    volumes:
      - /var/log/one_d4:/var/log/one_d4
    networks:
      # one-d4 for Java callers: java.net.URI gives a hostname containing an
      # underscore a null host, so no request built from one can be sent.
      # Compose keeps resolving the service key alongside this alias, so
      # Caddy's one_d4:8080 upstreams are unaffected.
      app_network:
        aliases:
          - one-d4
    depends_on:
      # The migrate gate is a strict superset of the old shared_postgres one
      # (the one-shot itself waits for Postgres). This service verifies at
      # boot that the migrations were applied and refuses to serve otherwise,
      # so releasing the two together without the gate crash-loops it against
      # a schema the one-shot has not finished writing.
      one_d4_migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # Check: /health answers 200 with {"status":"DOWN"} when Postgres is
      # unreachable, so only a non-2xx — or no answer at all — fails this.
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The index worker (#1389): the one thing that indexes. A poller on the
  # indexing_requests table (#1279) — any number of replicas claim, lease
  # and fence against the same rows. Every metric it writes carries
  # indexer="cpp", the label stored series are already keyed by.
  #
  # No port and no healthcheck: it serves nothing. Liveness is visible as
  # index_runs_total{indexer="cpp"} advancing, which a probe could not
  # tell you anyway — a worker with an empty queue is idle, not sick.
  #
  # Creates no schema. The one_d4_migrate step owns getting the tables in
  # place, so this gates on that one-shot finishing rather than on the Java
  # service being up — the two services now deploy in either order (#1419).
  one_d4_worker:
    image: ghcr.io/muchq/one_d4_worker:${ONE_D4_WORKER_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Chess index worker (C++)"
    restart: always
    logging: *default-logging
    environment:
      - ONE_D4_DB_URL=postgresql://one_d4:${ONE_D4_DB_PASSWORD}@shared_postgres:5432/one_d4
      # Requests indexed at once. A run is mostly waiting on chess.com and
      # Postgres, so this is sized for concurrent calls rather than for
      # the CPU cap below — and it is also what bounds concurrent requests
      # against chess.com, since a run fetches one month at a time.
      #
      # Costs two Postgres connections per slot: one the thread claims and
      # renews over, one the run flushes over. Eight here, against a
      # default max_connections of 100 that one_d4 and games_hub also draw
      # on. Neither may be shared — a heartbeat queued behind a flush is a
      # lease lost under a healthy run.
      - ONE_D4_INDEX_SLOTS=4
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4318
      - OTEL_SERVICE_NAME=one_d4_worker
      - OTEL_RESOURCE_ATTRIBUTES=service.name=one_d4_worker,service.version=${ONE_D4_WORKER_SHA:-${DEPLOY_SHA:-latest}}
    networks:
      - app_network
    depends_on:
      one_d4_migrate:
        condition: service_completed_successfully
    # Shutdown drains the runs in flight. A run checks per game, but it
    # cannot interrupt a chess.com call it is already inside, and that is
    # 60s per attempt times three attempts plus backoff — so the grace has
    # to cover one of those, not one game. The default ten seconds is a
    # kill, and a killed run hands its claim back to nobody: the range
    # then sits for the rest of the five-minute lease looking like it is
    # being worked on, times however many slots were busy.
    stop_grace_period: 240s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  microgpt-serve:
    image: ghcr.io/muchq/microgpt-serve:${MICROGPT_SERVE_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "microgpt text generation API"
    restart: always
    logging: *default-logging
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
      - MODEL_DIR=/etc/microgpt-serve/model
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4318
      - OTEL_SERVICE_NAME=microgpt-serve
      - OTEL_RESOURCE_ATTRIBUTES=service.name=microgpt-serve,service.version=${MICROGPT_SERVE_SHA:-${DEPLOY_SHA:-latest}}
    volumes:
      - /etc/microgpt-serve:/etc/microgpt-serve
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # Steady /health probe (#1307); see games_hub's for the full rationale.
      # microgpt-serve previously had no healthcheck at all, which is how its
      # dashboard sat empty for hours after a deploy until the first real
      # request arrived.
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8087 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  log_shipper:
    image: ghcr.io/muchq/log_shipper:${LOG_SHIPPER_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Rolled-log to S3 shipper: Caddy access logs, one_d4 query events (Go)"
    restart: always
    logging: *default-logging
    # Started only with `--profile stats`: it needs real S3 credentials in
    # ~/.env, and without them a default `up -d` would crash-loop it (#1457).
    profiles:
      - stats
    environment:
      - AWS_ACCESS_KEY_ID=${STATS_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${STATS_AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET=${STATS_S3_BUCKET}
      - S3_REGION=${STATS_S3_REGION:-us-east-1}
      # Each directory ships under its own partition (#1465).
      - LOG_DIRS=caddy=/var/log/caddy,one_d4=/var/log/one_d4
    volumes:
      # Read-write on purpose: rolled files are deleted after upload, which
      # is what keeps the host disk bounded once shipping owns retention.
      - /var/log/caddy:/var/log/caddy
      - /var/log/one_d4:/var/log/one_d4
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  stats_db_init:
    image: postgres:18
    restart: "no"
    logging: *default-logging
    profiles:
      - stats
    environment:
      PGHOST: shared_postgres
      PGUSER: one_d4
      PGDATABASE: one_d4
      PGPASSWORD: ${ONE_D4_DB_PASSWORD}
      STATS_DB_PASSWORD: ${STATS_DB_PASSWORD}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'stats'" | grep -q 1 \
          || psql -v ON_ERROR_STOP=1 -c "CREATE ROLE stats LOGIN"
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE stats WITH LOGIN PASSWORD '$${STATS_DB_PASSWORD}'"
        psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname = 'stats'" | grep -q 1 \
          || psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE stats OWNER stats"
    networks:
      - app_network
    depends_on:
      shared_postgres:
        condition: service_healthy

  stats:
    image: ghcr.io/muchq/stats:${STATS_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Log-derived stats aggregator and API (Go)"
    restart: always
    logging: *default-logging
    # Same profile as log_shipper: both halves of the pipeline need the
    # stats S3 credentials in ~/.env, so neither starts on a default up -d.
    profiles:
      - stats
    environment:
      - STATS_DB_URL=postgresql://stats:${STATS_DB_PASSWORD}@shared_postgres:5432/stats
      - AWS_ACCESS_KEY_ID=${STATS_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${STATS_AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET=${STATS_S3_BUCKET}
      - S3_REGION=${STATS_S3_REGION:-us-east-1}
      - PORT=8092
    networks:
      - app_network
    depends_on:
      shared_postgres:
        condition: service_healthy
      stats_db_init:
        condition: service_completed_successfully
    healthcheck:
      # Steady /health probe (#1307); see games_hub's for the full rationale.
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8092 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    restart: always
    logging: *default-logging
    ports:
      - "222:22"
      - "3000:3000"
    environment:
      - USER_UID=1000
      - USER_GID=1000
    volumes:
      - forgejo_data:/data
      - /etc/forgejo:/data/gitea/conf
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  caddy_data:
  caddy_config:
  forgejo_data:
  # Compose prefixes this with the project name, so the cluster is
  # ubuntu_shared_pgdata on the deploy host. Renaming this key does not rename
  # the volume: it creates an empty one for initdb to fill, and the stack comes
  # up healthy and blank. Renaming means migrating the volume on the host too.
  shared_pgdata:

networks:
  app_network:
    name: muchq_network
    driver: bridge
    # Pinned so Caddy's static address (and the trust boundary derived from
    # it) survives network recreation. Compose can't change a live network's
    # subnet in place: apply subnet edits with `docker compose down && up`.
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
