services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /var/log/caddy:/var/log/caddy
      - /var/www/r3dr:/var/www/r3dr
    depends_on:
      - games_ws_backend
      - golf_hub
      - microgpt-serve
      - mithril
      - one_d4
      - portrait
      - prom_proxy
      - r3dr
      - mcpserver
    networks:
      # Static address so services can name Caddy — and only Caddy — as
      # their x-forwarded-for trust boundary (smithy-cpp ADR-0012). The
      # anchor is the single source; consumers alias it as *caddy_ip.
      app_network:
        ipv4_address: &caddy_ip 172.28.0.2
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  games_ws_backend:
    image: ghcr.io/muchq/games_ws_backend:${GAMES_WS_BACKEND_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Websocket backend for v1 games"
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /etc/games_ws_backend:/etc/games_ws_backend
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # The smithy event-stream golf service (/games/v2/*, MoonBase#1187);
  # serves the v2 beta while games_ws_backend keeps serving v1.
  golf_hub:
    image: ghcr.io/muchq/golf_hub:${GOLF_HUB_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Golf v2 hub on smithy event streams (/games/v2/*)"
    restart: always
    ports:
      - "8089:8089"
    environment:
      PORT: "8089"
      # CSWSH defense: the play socket admits only the deployed UI's
      # origins (parity with the Go hub's allowlist).
      ALLOWED_ORIGINS: https://muchq.com,https://www.muchq.com
      TRUSTED_PROXY_CIDRS: *caddy_ip
      # Credentials live in the hub's own database on the shared postgres
      # instance (MoonBase#1194 step 1): tickets and resume tokens survive
      # deploys. golf_hub_db_init provisions the role + database.
      GOLF_HUB_DB_URL: postgresql://golf_hub:${GOLF_HUB_DB_PASSWORD}@shared_postgres:5432/golf_hub
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      OTEL_SERVICE_NAME: golf_hub
      OTEL_RESOURCE_ATTRIBUTES: service.name=golf_hub,service.version=${GOLF_HUB_SHA:-${DEPLOY_SHA:-latest}}
    networks:
      - app_network
    depends_on:
      golf_hub_db_init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # Steady /health probe (#1307): verifies the container serves, and keeps
      # the http_server_* series alive from boot, so dashboards don't go blind
      # after a deploy until the first real request. prom_proxy subtracts
      # route="/health" from every Serving number and charts it on the Probes
      # tile instead (#1303). Talks HTTP over bash's /dev/tcp because the
      # ubuntu base image ships no curl and no wget — see one_d4's probe for
      # the longer story, including why `timeout` bounds the probe itself.
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8089 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  portrait:
    image: ghcr.io/muchq/portrait:${PORTRAIT_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Ray-traced scene renderer"
    restart: always
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      # x-forwarded-for counts only from Caddy's pinned address; requests
      # reaching portrait any other way key as their TCP peer.
      TRUSTED_PROXY_CIDRS: *caddy_ip
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      OTEL_SERVICE_NAME: portrait
      OTEL_RESOURCE_ATTRIBUTES: service.name=portrait,service.version=${PORTRAIT_SHA:-${DEPLOY_SHA:-latest}}
    volumes:
      - /etc/portrait:/etc/portrait
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # Steady /health probe (#1307); see golf_hub's for the full rationale.
      # Deliberately the dedicated health endpoint and never the trace route:
      # a 503 for a render too large to allocate must stay a per-request
      # error, not evidence the container is sick — unhealthy status is what
      # health-conditioned tooling acts on, and under an orchestrator it
      # means restart. The deploy config test pins this.
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8081 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  prom_proxy:
    image: ghcr.io/muchq/prom_proxy:${PROM_PROXY_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Metrics API behind the dashboard"
    restart: always
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - PROMETHEUS_URL=http://prometheus:9090
    volumes:
      - /etc/prom_proxy:/etc/prom_proxy
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  mithril:
    image: ghcr.io/muchq/mithril:${MITHRIL_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Word-ladder solver (wordchains)"
    restart: always
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4318
      - OTEL_SERVICE_NAME=mithril
      - OTEL_RESOURCE_ATTRIBUTES=service.name=mithril,service.version=${MITHRIL_SHA:-${DEPLOY_SHA:-latest}}
    volumes:
      - /etc/mithril:/etc/mithril
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # Steady /health probe (#1307); see golf_hub's for the full rationale.
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8083 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  posterize:
    image: ghcr.io/muchq/posterize:${POSTERIZE_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Image blur and edge detection"
    restart: always
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4318
      - OTEL_SERVICE_NAME=posterize
      - OTEL_RESOURCE_ATTRIBUTES=service.name=posterize,service.version=${POSTERIZE_SHA:-${DEPLOY_SHA:-latest}}
    volumes:
      - /etc/posterize:/etc/posterize
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # Steady /health probe (#1307); see golf_hub's for the full rationale.
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8084 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  r3dr:
    image: ghcr.io/muchq/r3dr:${R3DR_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "URL shortener"
    restart: always
    ports:
      - "8085:8080"
    volumes:
      - /etc/r3dr:/etc/r3dr
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  mcpserver:
    image: ghcr.io/muchq/mcpserver:${MCPSERVER_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Model Context Protocol server"
    restart: always
    ports:
      - "8086:8080"
    environment:
      - PORT=8080
      - APP_NAME=mcpserver
      - ONE_D4_BASE_URL=http://one-d4:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4318
      - OTEL_SERVICE_NAME=mcpserver
      - OTEL_RESOURCE_ATTRIBUTES=service.name=mcpserver,service.version=${MCPSERVER_SHA:-${DEPLOY_SHA:-latest}}
    volumes:
      - /etc/mcpserver:/etc/mcpserver
    depends_on:
      one_d4:
        condition: service_healthy
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # Steady /health probe (#1307); see golf_hub's for the full rationale.
      # Served by mcpserver's HealthController — static liveness, no database
      # check, on the azul base whose bash/head/grep this command relies on
      # (same base as one_d4).
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The one Postgres instance on this host; one_d4 and golf_hub each keep a
  # database on it.
  #
  # The bootstrap database, role and pg_isready user are one_d4 because initdb
  # wrote them on first boot. POSTGRES_* is ignored on an initialized cluster,
  # so changing them here does nothing — that needs a migration.
  shared_postgres:
    image: postgres:18
    labels:
      com.muchq.description: "Shared PostgreSQL for MoonBase services"
    restart: always
    environment:
      - POSTGRES_DB=one_d4
      - POSTGRES_USER=one_d4
      - POSTGRES_PASSWORD=${ONE_D4_DB_PASSWORD}
    volumes:
      - shared_pgdata:/var/lib/postgresql
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U one_d4"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Idempotent one-shot provisioning of golf_hub's own database and role on
  # the shared postgres instance (MoonBase#1194). Idempotent — safe on every
  # deploy. Runs as the instance's bootstrap superuser. The docker-entrypoint
  # initdb.d hook can't do this: it only fires on a fresh data volume.
  golf_hub_db_init:
    image: postgres:18
    restart: "no"
    environment:
      PGHOST: shared_postgres
      PGUSER: one_d4
      PGDATABASE: one_d4
      PGPASSWORD: ${ONE_D4_DB_PASSWORD}
      GOLF_HUB_DB_PASSWORD: ${GOLF_HUB_DB_PASSWORD}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'golf_hub'" | grep -q 1 \
          || psql -v ON_ERROR_STOP=1 -c "CREATE ROLE golf_hub LOGIN"
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE golf_hub WITH LOGIN PASSWORD '$${GOLF_HUB_DB_PASSWORD}'"
        psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname = 'golf_hub'" | grep -q 1 \
          || psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE golf_hub OWNER golf_hub"
    networks:
      - app_network
    depends_on:
      shared_postgres:
        condition: service_healthy

  one_d4:
    image: ghcr.io/muchq/one_d4:${ONE_D4_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Chess game indexer and analysis"
    restart: always
    ports:
      - "8088:8080"
    environment:
      - APP_NAME=one_d4
      - PORT=8080
      - INDEXER_DB_URL=jdbc:postgresql://shared_postgres:5432/one_d4
      - INDEXER_DB_USERNAME=one_d4
      - INDEXER_DB_PASSWORD=${ONE_D4_DB_PASSWORD}
      - SENTRY_DSN=${ONE_D4_SENTRY_DSN}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4318
      - OTEL_SERVICE_NAME=one_d4
      - OTEL_RESOURCE_ATTRIBUTES=service.name=one_d4,service.version=${ONE_D4_SHA:-${DEPLOY_SHA:-latest}}
    networks:
      # one-d4 for Java callers: java.net.URI gives a hostname containing an
      # underscore a null host, so no request built from one can be sent.
      # Compose keeps resolving the service key alongside this alias, so
      # Caddy's one_d4:8080 upstreams are unaffected.
      app_network:
        aliases:
          - one-d4
    depends_on:
      shared_postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # Check: /health answers 200 with {"status":"DOWN"} when Postgres is
      # unreachable, so only a non-2xx — or no answer at all — fails this.
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The C++ index worker (#1389). Another poller on the same
  # indexing_requests table (#1279) rather than a second protocol: it
  # claims, leases and fences exactly as one_d4's own worker does, and the
  # two run side by side. Every metric it writes carries indexer="cpp", so
  # a dashboard can tell them apart.
  #
  # No port and no healthcheck: it serves nothing. Liveness is visible as
  # index_runs_total{indexer="cpp"} advancing, which a probe could not
  # tell you anyway — a worker with an empty queue is idle, not sick.
  #
  # Creates no schema. one_d4 owns the migrations and must be up first,
  # or this polls a table that does not exist yet.
  one_d4_worker:
    image: ghcr.io/muchq/one_d4_worker:${ONE_D4_WORKER_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "Chess index worker (C++)"
    restart: always
    environment:
      - ONE_D4_DB_URL=postgresql://one_d4:${ONE_D4_DB_PASSWORD}@shared_postgres:5432/one_d4
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4318
      - OTEL_SERVICE_NAME=one_d4_worker
      - OTEL_RESOURCE_ATTRIBUTES=service.name=one_d4_worker,service.version=${ONE_D4_WORKER_SHA:-${DEPLOY_SHA:-latest}}
    networks:
      - app_network
    depends_on:
      one_d4:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  microgpt-serve:
    image: ghcr.io/muchq/microgpt-serve:${MICROGPT_SERVE_SHA:-${DEPLOY_SHA:-latest}}
    labels:
      com.muchq.description: "microgpt text generation API"
    restart: always
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
      - MODEL_DIR=/etc/microgpt-serve/model
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4318
      - OTEL_SERVICE_NAME=microgpt-serve
      - OTEL_RESOURCE_ATTRIBUTES=service.name=microgpt-serve,service.version=${MICROGPT_SERVE_SHA:-${DEPLOY_SHA:-latest}}
    volumes:
      - /etc/microgpt-serve:/etc/microgpt-serve
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # Steady /health probe (#1307); see golf_hub's for the full rationale.
      # microgpt-serve previously had no healthcheck at all, which is how its
      # dashboard sat empty for hours after a deploy until the first real
      # request arrived.
      test: ["CMD", "timeout", "4", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8087 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    restart: always
    ports:
      - "222:22"
      - "3000:3000"
    environment:
      - USER_UID=1000
      - USER_GID=1000
    volumes:
      - forgejo_data:/data
      - /etc/forgejo:/data/gitea/conf
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  caddy_data:
  caddy_config:
  forgejo_data:
  # Compose prefixes this with the project name, so the cluster is
  # ubuntu_shared_pgdata on the deploy host. Renaming this key does not rename
  # the volume: it creates an empty one for initdb to fill, and the stack comes
  # up healthy and blank. Renaming means migrating the volume on the host too.
  shared_pgdata:

networks:
  app_network:
    name: muchq_network
    driver: bridge
    # Pinned so Caddy's static address (and the trust boundary derived from
    # it) survives network recreation. Compose can't change a live network's
    # subnet in place: apply subnet edits with `docker compose down && up`.
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
