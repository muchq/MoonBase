[package]
name = "ncm_cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ncm"
path = "src/main.rs"

[features]
metal = ["ncm/metal", "candle-core/metal"]
cuda = ["ncm/cuda", "candle-core/cuda"]

[dependencies]
ncm = { path = "../../libs/ncm" }
candle-core.workspace = true
clap = { workspace = true, features = ["derive"] }
serde_json.workspace = true
