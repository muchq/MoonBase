[package]
name = "microgpt_serve"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "HTTP inference service for microgpt using server_pal"

[[bin]]
name = "microgpt-serve"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
microgpt = { workspace = true }
opentelemetry = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
server_pal = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
http-body-util = { workspace = true }
# The in-memory exporter behind the zero-baseline test. server_pal already
# pulls this feature in, and crate_universe resolves one feature set per crate
# across the workspace, so this adds no new edge.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
