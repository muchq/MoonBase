name = "iili-web"
main = "worker/index.js"
# Current date (CF's recommendation). The Worker is an ASSETS proxy only —
# short-link redirects live on i.iili.uk (Caddy), so
# assets_navigation_prefers_asset_serving cannot swallow /r/*.
compatibility_date = "2026-08-21"

# Domain: iili.uk (SPA). Redirects: i.iili.uk → consolidated Caddy → r3dr_v2.

[assets]
directory = "dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Same as 1d4_web: let non-asset paths fall through to the SPA fallback
# instead of html_handling's 307s.
html_handling = "none"
