micronaut:
  server:
    port: ${PORT:8080}
  application:
    name: ${APP_NAME:helloworld}

  # mcpserver only. micronaut-mcp is on no other binary's classpath, so these keys
  # bind to nothing in the apps that share this file. transport has no usable
  # default: micronaut-mcp gates its whole server configuration on the property
  # being *present*, so leaving it out disables the MCP endpoint entirely rather
  # than falling back to HTTP.
  mcp:
    server:
      transport: HTTP
      endpoint: /mcp
      info:
        name: 1d4-mcp
        version: ${MCP_SERVER_VERSION:1.0.0}

# Micronaut 5 serializes the HTTP layer with Jackson 3, which flipped
# FAIL_ON_NULL_FOR_PRIMITIVES on. That is a wire-compatibility change, not a
# preference: a request body that sends an explicit null for an int field used
# to bind as 0 and would now be rejected with a 400 — for clients that have been
# sending exactly that. AggregateResponseWireTest and DtoJsonCompatTest pin it.
# Set explicitly rather than inherited, so the next Jackson default flip is a
# visible edit here instead of a behavior change nobody chose.
jackson:
  deserialization-features:
    FAIL_ON_NULL_FOR_PRIMITIVES: false
  date-time-features:
    # Instants stay epoch numbers. Jackson 3 writes ISO-8601 strings by default, which
    # would change every timestamp api.1d4.net returns — expiresAt among them — for
    # clients that are already parsing numbers. Jackson 3 moved this off
    # SerializationFeature onto its own DateTimeFeature enum, hence the separate key.
    WRITE_DATES_AS_TIMESTAMPS: true

mcp:
  auth:
    # Empty means open: McpAuthenticationFilter requires this to be non-empty
    # before it is created at all. The deployment sets no MCP_AUTH_TOKEN.
    token: ${MCP_AUTH_TOKEN:}
