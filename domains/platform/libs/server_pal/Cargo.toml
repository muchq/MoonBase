[package]
name = "server_pal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[dependencies]
axum = { workspace = true }
opentelemetry = { workspace = true }
rustls = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
webpki-root-certs = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tower_governor = { workspace = true }
tower-http = { workspace = true, features = ["full"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tower = "0.5"
# The in-memory exporter behind the label-set and unit tests. Costs one new
# Cargo.lock edge (opentelemetry_sdk -> tokio) and, because crate_universe
# resolves one feature set per crate across the whole workspace, the testing
# module is compiled into the production opentelemetry_sdk build too — dead
# code in the binaries, nothing more.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
