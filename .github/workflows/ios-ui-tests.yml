name: iOS UI tests

# Always report ios-ui; only allocate the simulator runner for relevant changes.
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every workflow declares its shell; see branch.yml.
defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.filter.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for iOS changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REVISION: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            needed=true
          else
            needed=$(./scripts/ios-ui-needed "$BASE_REVISION")
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  ios-ui-tests:
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      # As test-ios: pinned Xcode, and the iOS 27.0 runtime, the one whose
      # simulator list holds an iPhone 17.
      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          scripts/require-ios-sdk 27

      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: test-ios
          repository-cache: true

      - name: Run iOS UI tests with bazel
        run: |
          # Allow for a cold simulator boot, the full Time Attack round, and simulator teardown.
          bazel test //domains/games/apps/wordchains_ios:WordChainsUITests \
            --test_timeout=1800 \
            --ios_minimum_os=17.0 \
            --ios_simulator_device="iPhone 17" \
            --ios_simulator_version=27.0

      - name: Export simulator screenshots
        if: github.event_name == 'pull_request'
        run: |
          bundle="bazel-testlogs/domains/games/apps/wordchains_ios/WordChainsUITests/test.outputs/tests.xcresult"
          attachments="$RUNNER_TEMP/wordchains-attachments"
          screenshots="$RUNNER_TEMP/wordchains-screenshots"
          writable_bundle="$RUNNER_TEMP/wordchains-tests.xcresult"
          # xcresulttool may migrate the database in place. Bazel outputs are read-only.
          cp -R "$bundle" "$writable_bundle"
          chmod -R u+w "$writable_bundle"
          mkdir -p "$attachments" "$screenshots"
          xcrun xcresulttool export attachments --path "$writable_bundle" --output-path "$attachments"
          jq -r '.[] | .attachments[]? | select(.suggestedHumanReadableName | contains("WordChains-")) |
              [.exportedFileName, (.suggestedHumanReadableName | capture("(?<name>WordChains-[0-9]+-[a-z-]+)").name)] | @tsv' \
            "$attachments/manifest.json" | while IFS=$'\t' read -r file name; do
              cp "$attachments/$file" "$screenshots/$name.png"
            done

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: wordchains-ios-screenshots
          path: ${{ runner.temp }}/wordchains-screenshots/*.png
          if-no-files-found: error

  # Require this check in branch protection. A failed filter must never turn
  # into a passing check just because its dependent simulator job was skipped.
  ios-ui:
    runs-on: ubuntu-latest
    needs: [changes, ios-ui-tests]
    if: always()
    steps:
      - name: Require successful iOS UI tests when needed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NEEDED: ${{ needs.changes.outputs.needed }}
          TEST_RESULT: ${{ needs.ios-ui-tests.result }}
        run: |
          [ "$CHANGES_RESULT" = success ]
          case "$NEEDED:$TEST_RESULT" in
            true:success|false:skipped) ;;
            *) echo "Unexpected iOS UI result: needed=$NEEDED, result=$TEST_RESULT" >&2; exit 1 ;;
          esac
