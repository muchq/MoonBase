name: iOS UI tests

# WordChainsUITests drive the app in a booted simulator: minutes per run on
# top of the simulator test-ios already boots, so they stay off every PR.
# They run on main after any wordchains_ios change, on a PR labelled
# `ios-ui`, and by hand.
on:
  push:
    branches: [ "main" ]
    paths:
      - "domains/games/apps/wordchains_ios/**"
      - "domains/games/apps/wordchains/**"
      - "domains/games/libs/wordchains/**"
      - "bazel/apple.MODULE.bazel"
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:

concurrency:
  group: ios-ui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every workflow declares its shell; see branch.yml.
defaults:
  run:
    shell: bash

jobs:
  ios-ui-tests:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ios-ui')
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      # As test-ios: pinned Xcode, and the iOS 27.0 runtime, the one whose
      # simulator list holds an iPhone 17.
      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          scripts/require-ios-sdk 27

      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: test-ios
          repository-cache: true

      - name: Run iOS UI tests with bazel
        run: |
          bazel test //domains/games/apps/wordchains_ios:WordChainsUITests \
            --ios_minimum_os=17.0 \
            --ios_simulator_device="iPhone 17" \
            --ios_simulator_version=27.0
