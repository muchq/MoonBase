name: Release wordchains-ios

# A version is released once: when main's Info.plist names a version with no
# wordchains-ios-v<version> tag. The tag is the record, so a bump released
# from any commit, or a version marked done by hand, is never released again.
# Pushing a tag releases nothing; to retry a failed build, delete its tag.
on:
  workflow_run:
    workflows: ["Test and Publish"]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: release-wordchains-ios
  cancel-in-progress: false

# Every workflow declares its shell; see branch.yml.
defaults:
  run:
    shell: bash

jobs:
  check-and-tag:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.version_check.outputs.version }}
      tag: ${{ steps.version_check.outputs.tag }}
      should_release: ${{ steps.version_check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Ubuntu has no PlistBuddy; plist-string fails rather than printing
      # nothing, so a broken read can't name a tag that never exists.
      - name: Check for an untagged version
        id: version_check
        run: |
          VERSION=$(scripts/plist-string domains/games/apps/wordchains_ios/Info.plist CFBundleShortVersionString)
          TAG="wordchains-ios-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # ls-remote exits 0 with no output for a missing ref; a failed
          # query fails the step instead of reading as "untagged".
          FOUND=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$FOUND" ]; then
            echo "$TAG exists; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG does not exist; releasing $VERSION"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.version_check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version_check.outputs.version }}
          TAG: ${{ steps.version_check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release wordchains-ios v${VERSION}"
          git push origin "$TAG"

  build:
    needs: [check-and-tag]
    if: needs.check-and-tag.outputs.should_release == 'true'
    runs-on: macos-26
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
      ipa: ${{ steps.stage.outputs.ipa }}
      sha: ${{ steps.stage.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set build number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" \
            domains/games/apps/wordchains_ios/Info.plist

      - name: Run unit tests
        working-directory: domains/games/apps/wordchains_ios
        run: swift test

      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: release-wordchains-ios
          repository-cache: true

      # Imports the distribution certificate into a throwaway keychain and
      # decodes the provisioning profile where BUILD.bazel's
      # :provisioning_profile filegroup picks it up. When the signing secrets
      # aren't configured yet, fall back to an unsigned simulator build so the
      # GitHub Release still gets an artifact (not App Store uploadable).
      # See domains/games/apps/wordchains_ios/docs/RELEASE.md for setup.
      - name: Set up code signing
        id: signing
        env:
          CERT_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$CERT_P12" ] || [ -z "$PROFILE" ]; then
            echo "::warning::IOS_DISTRIBUTION_CERT_P12 / IOS_PROVISIONING_PROFILE not set — falling back to an unsigned simulator build. See domains/games/apps/wordchains_ios/docs/RELEASE.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/wordchains-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 1800 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "$PROFILE" | base64 --decode \
            > domains/games/apps/wordchains_ios/WordChains.mobileprovision
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Device (arm64) build when signing is available — simulator builds are
      # rejected by App Store Connect. rules_apple emits a signed IPA directly;
      # re-zipping the .app by hand would break the code signature.
      # .bazelrc downloads no outputs; the IPA is staged below, and a cache
      # hit would otherwise leave it unmaterialized.
      - name: Build iOS app
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            bazel build //domains/games/apps/wordchains_ios:WordChains \
              --remote_download_outputs=toplevel \
              --ios_minimum_os=17.0 \
              --ios_multi_cpus=arm64 \
              --define=ios_release_signing=true
          else
            bazel build //domains/games/apps/wordchains_ios:WordChains \
              --remote_download_outputs=toplevel \
              --ios_minimum_os=17.0 \
              --apple_platform_type=ios
          fi

      - name: Stage release artifacts
        id: stage
        run: |
          VERSION="${{ needs.check-and-tag.outputs.version }}"
          BUILD="${{ github.run_number }}"

          cp bazel-bin/domains/games/apps/wordchains_ios/WordChains.ipa \
            "WordChains-${VERSION}-${BUILD}.ipa"
          shasum -a 256 "WordChains-${VERSION}-${BUILD}.ipa" | awk '{print $1}' > "WordChains-${VERSION}-${BUILD}.sha256.txt"

          echo "IPA_FILE=WordChains-${VERSION}-${BUILD}.ipa" >> "$GITHUB_ENV"
          echo "SHA_FILE=WordChains-${VERSION}-${BUILD}.sha256.txt" >> "$GITHUB_ENV"
          # The release job names these files rather than globbing for them.
          echo "ipa=WordChains-${VERSION}-${BUILD}.ipa" >> "$GITHUB_OUTPUT"
          echo "sha=WordChains-${VERSION}-${BUILD}.sha256.txt" >> "$GITHUB_OUTPUT"

      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/wordchains-signing.keychain-db" 2>/dev/null || true
          rm -f domains/games/apps/wordchains_ios/WordChains.mobileprovision

      - uses: actions/upload-artifact@v7
        with:
          name: wordchains-ios-ipa
          path: |
            ${{ env.IPA_FILE }}
            ${{ env.SHA_FILE }}

  release:
    needs: [check-and-tag, build]
    if: always() && needs.build.result == 'success'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Named, the artifact's files land directly in artifacts/, so the
      # release names them from the build's outputs: no glob to match.
      - uses: actions/download-artifact@v8
        with:
          name: wordchains-ios-ipa
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-and-tag.outputs.version }}"
          TAG="${{ needs.check-and-tag.outputs.tag }}"
          IPA="artifacts/${{ needs.build.outputs.ipa }}"
          SHA="artifacts/${{ needs.build.outputs.sha }}"
          if [ ! -f "$IPA" ] || [ ! -f "$SHA" ]; then
            echo "::error::$IPA or $SHA missing from the downloaded artifact"
            ls -R artifacts
            exit 1
          fi
          gh release create "$TAG" \
            --title "wordchains-ios v${VERSION}" \
            --generate-notes \
            "$IPA" "$SHA"

      # Upload to App Store Connect (TestFlight) with fastlane pilot, which is
      # preinstalled on GitHub macOS runners and uses the App Store Connect
      # API (altool --upload-app is deprecated).
      # Requires: APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
      #           APP_STORE_CONNECT_API_KEY (base64-encoded .p8 private key)
      # See domains/games/apps/wordchains_ios/docs/RELEASE.md for setup.
      - name: Upload to App Store Connect
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          # An unsigned simulator IPA can only be rejected.
          if [ "$SIGNED" != true ]; then
            echo "::warning::IPA is unsigned — skipping App Store upload."
            exit 0
          fi
          if [ -z "$APP_STORE_KEY_ID" ]; then
            echo "::warning::APP_STORE_CONNECT_API_KEY_ID not set — skipping App Store upload."
            echo "See domains/games/apps/wordchains_ios/docs/RELEASE.md for setup instructions."
            exit 0
          fi

          API_KEY_JSON="$RUNNER_TEMP/asc_api_key.json"
          jq -n \
            --arg key_id "$APP_STORE_KEY_ID" \
            --arg issuer_id "$APP_STORE_ISSUER_ID" \
            --arg key "$(echo "$APP_STORE_KEY" | base64 --decode)" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > "$API_KEY_JSON"

          IPA_FILE="artifacts/${{ needs.build.outputs.ipa }}"

          fastlane pilot upload \
            --ipa "$IPA_FILE" \
            --api_key_path "$API_KEY_JSON" \
            --skip_waiting_for_build_processing true

          rm -f "$API_KEY_JSON"
          echo "Uploaded to App Store Connect (TestFlight) successfully."
