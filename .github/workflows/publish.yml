name: "Test and Publish"

on:
  push:
    branches: [ "main" ]

# One publish at a time, none cancelled: two runs overlapping could leave
# :latest on the older commit.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

# Every workflow declares its shell; see branch.yml.
defaults:
  run:
    shell: bash

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/muchq/moonbase/ci-base:latest

    # The same postgres branch.yml runs, for the same reason: `bazel test //...`
    # reaches the DB-gated suites, and one_d4's fail rather than skip when CI is
    # set (#1532). Without a database here, main publishes nothing.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: moonbase_test
          POSTGRES_PASSWORD: moonbase_test
          POSTGRES_DB: moonbase_test
        options: >-
          --health-cmd "pg_isready -U moonbase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GAMES_HUB_TEST_DB_URL: postgresql://moonbase_test:moonbase_test@postgres:5432/moonbase_test
      PG_TEST_DB_URL: postgresql://moonbase_test:moonbase_test@postgres:5432/moonbase_test
      STATS_TEST_DB_URL: postgresql://moonbase_test:moonbase_test@postgres:5432/moonbase_test

    steps:
      - uses: actions/checkout@v7

      - name: Configure git safe directory
        run: git config --global --add safe.directory /__w/MoonBase/MoonBase

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          google-credentials: ${{ secrets.GOOGLE_CLOUD_KEY }}
          bazelrc: |
            build --remote_cache=https://storage.googleapis.com/moon_base_build_cache
            build --remote_upload_local_results=true

      - name: bazel-format-check
        run: |
          bazel run //:format.check

      - name: bazel-test
        run: |
          bazel build //... && bazel test //...

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each image is pushed once and tagged twice from that push: latest,
      # and the commit for deploy.sh pins and rollback. Tagging the built
      # image rather than re-pulling :latest keeps the commit tag the exact
      # manifest bazel produced, which is what a PR's blast-radius comparison
      # reads it against.
      - name: bazel-run-oci-push
        run: |
          bazel query 'kind(oci_push, //...)' | xargs -n1 -I{} bazel run {} -- --tag "${{ github.sha }}"
