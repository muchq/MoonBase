name: Build CI Docker Image

# ci-base is tagged by its Dockerfile's content (scripts/ci-image-tag).
# branch.yml and publish.yml call this before their container jobs and run on
# the tag it returns, so a PR that edits Dockerfile.ci runs on the image it
# describes. A call builds only a tag that is missing; the weekly run rebuilds
# the current one to pick up security updates.
on:
  workflow_call:
    outputs:
      image:
        description: The ci-base image the caller's container jobs run on
        value: ${{ jobs.ci-image.outputs.image }}
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 2 AM UTC

permissions:
  contents: read
  packages: write

# Every workflow declares its shell; see branch.yml.
defaults:
  run:
    shell: bash

jobs:
  ci-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        run: echo "image=ghcr.io/muchq/moonbase/ci-base:$(scripts/ci-image-tag)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Called from a PR or a push, an existing tag is the answer. The
      # scheduled and manual runs rebuild it regardless.
      - name: Check for an existing image
        id: existing
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.existing.outputs.found != 'true'
        uses: docker/setup-buildx-action@v4

      # For the labels: org.opencontainers.image.source links the package to
      # this repo.
      - name: Extract metadata
        id: meta
        if: steps.existing.outputs.found != 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/muchq/moonbase/ci-base

      - name: Build and push Docker image
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/Dockerfile.ci
          push: true
          tags: ${{ steps.tag.outputs.image }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=min,scope=ci-image
