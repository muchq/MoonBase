name: "Branch Build"

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/muchq/moonbase/ci-base:latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure git safe directory
        run: git config --global --add safe.directory /__w/MoonBase/MoonBase

      # Runs deploy.sh end to end against a fake host — no ssh, docker, or
      # network. Nothing else in CI executes this script.
      - name: Test deploy.sh
        run: ./scripts/test-deploy

  # deploy_config_test pins the text of the collector config, which can only
  # catch mistakes someone already knew to look for: `match_type: glob` passed
  # review and passed the line-presence test that existed at the time, and would
  # have taken the whole metrics pipeline down on deploy. This starts the pinned
  # collector against the real config instead.
  #
  # Its own job, not a step in test-deploy: that one runs inside the ci-base
  # container and this needs the runner's own docker. Path-gated because it
  # pulls the collector image, and nothing outside these three files can change
  # the answer.
  validate-otel-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for collector config changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- \
            deploy/consolidated/o11y/otel-collector.yml \
            deploy/consolidated/docker-compose.observability.yml \
            scripts/validate-otel-config)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run the collector config
        if: steps.filter.outputs.changed == 'true'
        run: ./scripts/validate-otel-config

  # deploy.sh runs from a developer machine, and macOS ships bash 3.2 as
  # /bin/bash — no associative arrays or case-conversion expansions. The Linux
  # job above runs bash 5 and cannot reproduce that, so run the same suite on a
  # mac against /bin/bash explicitly.
  test-deploy-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for deploy changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- deploy/ scripts/test-deploy)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Explicitly /bin/bash: the runner may have a newer bash earlier in PATH,
      # which would defeat the point of running here at all.
      - name: Test deploy.sh under system bash
        if: steps.filter.outputs.changed == 'true'
        run: |
          /bin/bash --version | head -1
          /bin/bash scripts/test-deploy

  format-check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/muchq/moonbase/ci-base:latest

    steps:
      - uses: actions/checkout@v7

      - name: Download google-java-format
        run: |
          GJF_SHA256=$(awk '/name = "google-java-format"/{f=1} f && /sha256/{gsub(/.*sha256 = "|".*/, ""); print; exit}' bazel/tools.MODULE.bazel)
          GJF_URL=$(awk '/name = "google-java-format"/{f=1} f && /url =/{gsub(/.*url = "|".*/, ""); print; exit}' bazel/tools.MODULE.bazel)
          GJF_JAR="/tmp/google-java-format.jar"
          echo "Downloading $GJF_URL"
          curl -fsSL -o "$GJF_JAR" "$GJF_URL"
          echo "$GJF_SHA256  $GJF_JAR" | sha256sum -c -

      - name: Check Java formatting
        run: |
          GJF_JAR="/tmp/google-java-format.jar"
          JAVA_FILES=$(find . -name "*.java" -not -path "*/bazel-*" | sort)
          FILE_COUNT=$(echo "$JAVA_FILES" | grep -c . || echo 0)
          if [ -z "$JAVA_FILES" ]; then
            echo "No Java files found."
            exit 0
          fi
          echo "Checking $FILE_COUNT Java files..."
          java \
            --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
            -jar "$GJF_JAR" --dry-run --set-exit-if-changed $JAVA_FILES
          echo "All $FILE_COUNT files correctly formatted."

  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/muchq/moonbase/ci-base:latest

    # A real postgres for the DB-gated suites (pg_test, pg_ticket_vault_test):
    # without it they skip silently and none of the SQL is exercised on main.
    # Image tracks the deployed postgres:18 (deploy/consolidated/compose.yaml).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: moonbase_test
          POSTGRES_PASSWORD: moonbase_test
          POSTGRES_DB: moonbase_test
        options: >-
          --health-cmd "pg_isready -U moonbase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GOLF_HUB_TEST_DB_URL: postgresql://moonbase_test:moonbase_test@postgres:5432/moonbase_test
      PG_TEST_DB_URL: postgresql://moonbase_test:moonbase_test@postgres:5432/moonbase_test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch full history for bazel-diff

      - name: Configure git safe directory
        run: git config --global --add safe.directory /__w/MoonBase/MoonBase

      - name: Free up disk space
        run: |
          df -h
          rm -rf /usr/share/dotnet
          rm -rf /opt/ghc
          rm -rf "/usr/local/share/boost"
          rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelrc: |
            # Public-repo ubuntu-latest runners are 4 vCPU / 16 GB; leave
            # headroom below that so concurrent -c opt compiles of the
            # heaviest TUs (protobuf, otel, beast) don't OOM the runner.
            build --local_resources=cpu=4
            build --local_resources=memory=12288
      - name: Create bazel-diff output directory
        run: |
          mkdir -p bazel-diff-output
      - name: bazel-diff-build-and-test
        run: |
          ./scripts/diff-build origin/main

  # Sanitizers (#1273). The class of bug these catch — use-after-free, leaks,
  # signed overflow — has no symptom an assertion can see, so before this job
  # existed CI was blind to all of it. #1272 shipped a use-after-free fix
  # whose test could only pin the recovery shape, and #1274 was a leak on
  # portrait's render path that 22 green tests walked straight past.
  #
  # Its own job rather than more flags on build-and-test: that one is already
  # the long pole, and a sanitized build is a separate configuration with its
  # own object tree, not an extra flag on an existing one.
  #
  # Scope is the first-party C++ tests whose dependency closure is also
  # first-party. That is a build-cost line, not a compatibility one — the
  # Beast, opentelemetry-cpp and Postgres targets do build and pass under
  # ASan; they just add a full instrumented -c dbg rebuild of boost and otel
  # to a runner that has to free disk before it can build at all. Widening
  # that is a runner-budget call rather than a technical one.
  #
  # A matrix rather than three steps in one job, for two reasons. The three
  # configs share no build output — each is a distinct object tree, so
  # sequential steps would serialize three full builds for nothing — and
  # fail-fast is off so one sanitizer's finding does not hide the other two.
  # ASan and TSan are mutually exclusive at link time anyway.
  sanitize:
    name: sanitize (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/muchq/moonbase/ci-base:latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan, tsan]

    steps:
      - uses: actions/checkout@v7

      - name: Free up disk space
        run: |
          df -h
          rm -rf /usr/share/dotnet
          rm -rf /opt/ghc
          rm -rf "/usr/local/share/boost"
          rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          # A key per sanitizer. Separate from build-and-test's because these
          # are -c dbg and instrumented, and separate from each other's
          # because the three configs share no object tree — one key would
          # just have them evicting each other on every run.
          disk-cache: ${{ github.workflow }}-sanitize-${{ matrix.sanitizer }}
          repository-cache: true
          bazelrc: |
            build --local_resources=cpu=4
            build --local_resources=memory=12288

      - name: Resolve target set
        id: targets
        run: |
          TARGETS=$(bazel query 'kind(cc_test, //domains/...) except (
            //domains/games/apis/golf_hub/... union
            //domains/platform/libs/pg/... union
            //domains/platform/libs/aura/... union
            //domains/platform/libs/futility/otel/... union
            //domains/graphics/apis/portrait/...)' | tr '\n' ' ')
          if [ -z "$TARGETS" ]; then
            echo "target query matched nothing; refusing to report a vacuous pass"
            exit 1
          fi
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "Sanitizing: $TARGETS"

      - name: Test under ${{ matrix.sanitizer }}
        run: bazel test --config=${{ matrix.sanitizer }} ${{ steps.targets.outputs.targets }}

  # Metal GPU training requires macOS; run microgpt tests on Apple Silicon when relevant files change.
  test-microgpt-metal:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for microgpt changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- domains/ai/libs/microgpt/ domains/ai/apps/microgpt_cli/)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run microgpt Metal tests
        if: steps.filter.outputs.changed == 'true'
        working-directory: domains/ai/libs/microgpt
        run: cargo test --features metal -- test_metal

  # 1d4_web uses npm/Vite; always run typecheck, tests, and build on every PR.
  test-1d4-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: domains/games/apps/1d4_web/package-lock.json

      - name: Install dependencies
        working-directory: domains/games/apps/1d4_web
        run: npm ci

      - name: Typecheck
        working-directory: domains/games/apps/1d4_web
        run: npm run typecheck

      - name: Run tests
        working-directory: domains/games/apps/1d4_web
        run: npm test

      - name: Build
        working-directory: domains/games/apps/1d4_web
        run: npm run build

  # iOS targets can't build on Ubuntu; run Swift tests on macOS when relevant files change.
  test-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for iOS changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- domains/games/apps/wordchains_ios/ domains/games/libs/wordchains/)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run wordchains-ios tests
        if: steps.filter.outputs.changed == 'true'
        working-directory: domains/games/apps/wordchains_ios
        run: swift test

      - uses: bazel-contrib/setup-bazel@0.19.0
        if: steps.filter.outputs.changed == 'true'
        with:
          bazelisk-cache: true
          disk-cache: test-ios
          repository-cache: true

      - name: Build iOS app with bazel
        if: steps.filter.outputs.changed == 'true'
        run: |
          bazel build //domains/games/apps/wordchains_ios:WordChains \
            --ios_minimum_os=17.0 \
            --apple_platform_type=ios

      # swift.enable_testing is needed for @testable imports because the repo
      # builds -c opt, where rules_swift disables testability by default.
      # Without an explicit simulator device the test runner pairs an ancient
      # device type (iPhone 6s Plus) with the latest iOS runtime and the
      # simulator fails to boot.
      - name: Run iOS unit tests with bazel
        if: steps.filter.outputs.changed == 'true'
        run: |
          bazel test //domains/games/apps/wordchains_ios:WordChainsTests \
            --ios_minimum_os=17.0 \
            --features=swift.enable_testing \
            --ios_simulator_device="iPhone 16"
